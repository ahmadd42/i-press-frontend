<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta name="author" content="">

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <!-- Twitter -->
  <meta name="twitter:card" content="">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="">

  <link rel="stylesheet" href="../styling/verify-email.css">
  <link rel="stylesheet" href="../styling/login-page.css">
  <link rel="stylesheet" href="../styling/modal-window.css">
  <link rel="stylesheet" href="../styling/printing-press-logo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/png" href="../graphics/favicon.png">

  <title>Change your password</title>
  
</head>
<body>
<div id="con" class="container">
<div id="logo" class="logo-panel">
    <img src="../graphics/logo-large.jpg">
</div>
<div id="reset" class="login-panel" style="margin-top: 3em;">

<!--  <div class="center"> -->
    <form class="card" id="resetForm" autocomplete="on" onsubmit="changePwd(event)">
      <h1 style="margin-bottom: 1.8em;">Reset password</h1>

      <div style="display:flex;margin-bottom:1.3em;">
        <div style="margin-top:.5em;width:12em"><label for="password">Enter new password:</label></div>
        <div class="password-container">
        <input style="width: 18em;" id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <span class="password-toggle" id="togglePassword1" onclick="togglePwdView(event)"><i id="pwd-toggle1" class="fa fa-eye"></i></span>
        </div>
      </div>

      <div style="display:flex;margin-bottom:1.5em;">
        <div style="margin-top:.5em;width:12em"><label for="password">Confirm new password:</label></div>
        <div class="password-container">
        <input style="width: 18em;" id="con-password" name="con-password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <span class="password-toggle" id="togglePassword2" onclick="togglePwdView(event)"><i id="pwd-toggle2" class="fa fa-eye"></i></span>
        </div>
      </div>


      <div class="actions">
        <button id="submit_btn" type="submit">Reset</button>
      </div>
<div class="loader" id="loading" style="margin-top: 1.5em;"><img src="../graphics/loading-dots.gif" /></div>     
      <p></p>
      <p id="errorMsg" class="error"></p>
    </form>
<!--  </div> -->
</div>
</div>
<div id="ads" class="ads-panel"></div>

<!-- Success Modal -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <div style="display: flex;">
      <div class="favicon-div"></div>
      <p style="margin-left:1em;">Your password has been changed successfully.</p>
      </div>
      <div class="last-buttons">
      <button class="close-btn" id="login_btn">Sign in</button>
      <button class="close-btn" id="home_btn">Back to Home</button>

      </div>
    </div>
  </div>


<script>
const pwd_controls = {"pwd-toggle1":"password", "pwd-toggle2":"con-password"};
const usr_email = localStorage.getItem("email");
const pass = document.getElementById("password");
const con_pass = document.getElementById("con-password");
const err = document.getElementById("errorMsg");
const login_btn = document.getElementById("login_btn");
const home_btn = document.getElementById("home_btn");
const dots = document.getElementById("loading");

if(!usr_email) {
    window.location.href = "/";
  }
else {
  localStorage.clear();
}

login_btn.addEventListener("click", (event) => {
    window.location.href = "login.html";
  });

home_btn.addEventListener("click", (event) => {
    window.location.href = "/";
  });


function togglePwdView(e) {

const pwd_control = document.getElementById(pwd_controls[e.target.id]);

  if (pwd_control.type === "password") {
    pwd_control.type = "text";
    e.target.className = "fa fa-eye-slash";
  } else {
    pwd_control.type = "password";
    e.target.className = "fa fa-eye";
  }      
    }

async function changePwd(e) {
    e.preventDefault();
    err.innerText = "";
    
    if(pass.value != con_pass.value) {
      err.innerText = "Values in both password fields do not match";
      return;
    }

    dots.style.display = "flex";

  try {
    const res = await fetch("https://i-press-backend-production.up.railway.app/files/resetpass", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({email: usr_email, new_pass: pass.value})
    });

        dots.style.display = "none";

    if (res.status === 200) {                
      document.getElementById("successModal").style.display = "flex";
    }
  } catch (err) {
    console.error("Error sending code:", err);
    //errorMsg.textContent = "Network error.";
  }

  }

</script>
</body>
</html>
